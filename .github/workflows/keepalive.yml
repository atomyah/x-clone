name: Keep Vercel Alive
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://x-clone.tech/)
          echo "Status: $STATUS - https://x-clone.tech/"